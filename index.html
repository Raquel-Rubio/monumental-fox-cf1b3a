<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meu Projeto AR</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam;" cursor="rayOrigin: mouse" raycaster="objects: .tocavel">
    
    <a-entity camera></a-entity>
    
    <a-marker preset="hiro">
      
      <a-entity class="tocavel"
                gltf-model="url(updated_maxwell_the_cat.glb)" 
                scale="2.5 2.5 2.5" 
                position="0 0 0"
                rotation="-90 0 0"
                animation__up="property: position; to: 0 0 0.6; startEvents: mousedown; dur: 200"
                animation__down="property: position; to: 0 0 0; startEvents: mouseup; dur: 200"
                animation__click="property: rotation; to: -90 360 0; startEvents: click; dur: 800; easing: easeOutQuad">
      </a-entity>
      
      <a-light type="ambient" color="#BBB"></a-light>
      
      <a-light type="directional" intensity="0.8" position="-1 4 5"></a-light>
      
    </a-marker>
  </a-scene>

</body>
</html>
